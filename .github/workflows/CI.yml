name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # LibOpenCRG's finalizer thread-safety tests need more than one thread
      # to be meaningful.
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        # OpenCRG.jl lives at the repo root, LibOpenCRG.jl in a subdirectory.
        # Each package is tested on its own (Pkg.test in its own directory,
        # with the test/Project.toml environment), never via the other.
        package: ['.', 'lib/LibOpenCRG.jl']
        version: ['1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        # LTS only on Linux. An include entry that cannot merge into an
        # existing combination becomes its own job, so list one per package.
        include:
          - {package: '.', version: 'lts', os: ubuntu-latest}
          - {package: 'lib/LibOpenCRG.jl', version: 'lts', os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          # The matrix runs one package per job, so only its own src/ has
          # coverage data; across the matrix both src/ and lib/LibOpenCRG.jl/src
          # are covered.
          directories: ${{ matrix.package == '.' && 'src' || 'lib/LibOpenCRG.jl/src' }}
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: ${{ matrix.package == '.' && 'OpenCRG' || 'LibOpenCRG' }}
          fail_ci_if_error: false
