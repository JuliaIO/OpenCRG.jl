name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # LibOpenCRG's finalizer test needs more than one thread to be meaningful.
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        # OpenCRG.jl lives at the repo root, LibOpenCRG.jl in a subdirectory.
        package: ['.', 'lib/LibOpenCRG.jl']
        version: ['lts', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: ${{ matrix.package }}/src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ matrix.package == '.' && 'OpenCRG' || 'LibOpenCRG' }}
          fail_ci_if_error: false
